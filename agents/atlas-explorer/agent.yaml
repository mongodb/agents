# Human-readable app slug used by Agent Engine tooling.
name: atlas-explorer
# Node entry point for the Agent Engine SDK App instance.
# Format: <module path>:<export name>. This template exposes `app` from
# src/agent_atlas_explorer/main.ts (compiled to dist/agent_atlas_explorer/main.js).
entrypoint: agent_atlas_explorer.main:app
framework: langgraph
# Programming language for this agent.
language: typescript
# deep_agent registers the Tool Pod filesystem/shell handlers used by
# App.deepAgent(). Long-term memory is not part of the source Atlas agent.
features:
    memory: false
    deep_agent: true
# Declare which secrets each workload may access. Entries are secret NAMES
# (e.g. OPENAI_API_KEY), never secret values - values go in .env locally, or
# in the platform secret store (`agentengine secret set`) for deployed agents.
# MONGODB_URI is injected into every workload and need not be listed.
# invoke_llm is a reserved tool name: the platform runs model calls in a tool
# pod, so the LLM provider key must also be declared under tools.invoke_llm.
required_secrets:
    aer:
        - OPENAI_API_KEY
        - ATLAS_MCP_CLIENT_ID
        - ATLAS_MCP_CLIENT_SECRET
    tools:
        invoke_llm:
            - OPENAI_API_KEY
        "mongodb__*":
            - ATLAS_MCP_CLIENT_ID
            - ATLAS_MCP_CLIENT_SECRET
# AER discovers remote MCP tools at startup and Tool Pods execute subsequent
# calls. Both exchange the configured client credentials for OAuth tokens.
network:
    egress:
        - fqdn: cloud.mongodb.com
          ports: [443]
          component: all
        - fqdn: mcp.mongodb.com
          ports: [443]
          component: all
        - fqdn: api.openai.com
          ports: [443]
          component: tool
        - fqdn: knowledge.mongodb.com
          ports: [443]
          component: tool
# Operators provision these MCP credentials and store them as runtime secrets.
mcp:
    servers:
        mongodb:
            transport: streamable_http
            url: https://mcp.mongodb.com
            auth:
                type: client_credentials
                token_url: https://cloud.mongodb.com/api/oauth/token
                client_id_env: ATLAS_MCP_CLIENT_ID
                client_secret_env: ATLAS_MCP_CLIENT_SECRET
            timeout_seconds: 30
version: 0.1.0
