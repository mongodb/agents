# Project-level settings go in this file.

memory:
  # Memory-server log level. One of: debug | info | warning | error | critical.
  log_level: info

  # Voyage AI embeddings.
  # The Voyage API key is NOT set here — upload it as a project secret with:
  #   agentengine secret set VOYAGE_API_KEY
  voyage:
    model: "voyage-4-large"
    dimension: 1024

  # Short-term memory write-path behaviour.
  short_term:
    # Embed each turn's content when it is written (only when the caller supplies
    # no embedding), so it is searchable by relevance immediately instead of
    # waiting for background embedding. Adds embedding latency to the write.
    embed_on_write: false

  # LLM used for background extraction.
  # The provider's API key is NOT set here — upload it as a project secret with:
  #   agentengine secret set <PROVIDER>_API_KEY   (e.g. OPENAI_API_KEY)
  extraction_llm:
    provider: openai             # one of: openai | anthropic | gemini | cerebras
    model: null                  # overrides the provider's default model

  background_extraction:
    # Snapshot promotion
    snapshot:
      max_messages: 20
      stale_minutes: 3
      embed_stm_before_promotion: true
      topic_shift_enabled: false   # requires embed_stm_before_promotion: true
      topic_shift_threshold: 0.35
      delete_promoted: false
      ttl_days: 30

  # Extraction pipeline. The 'enabled' list below selects which memory types are
  # extracted in the background; it ships with a sensible default set. Edit the
  # list to add or remove types, or set it to [] to turn extraction off entirely.
  # Valid types: semantic, episodic, taxonomic, entity, preferences, procedural.
  # Each type may also take an optional 'prompt' to override the system default, e.g.
  #   semantic:
  #     prompt: "..."
  # NOTE: removing the 'enabled' line entirely falls back to the server default;
  # keep an explicit list (or []) to control exactly which types run.
  extraction:
    enabled:
      - semantic
      - episodic
      - taxonomic
      - procedural
