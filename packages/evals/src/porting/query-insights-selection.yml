# Cases ported into datasets/query-insights.yml. Regenerate with:
#
#   pnpm port:query-insights --source-dir <source eval cases dir> \
#     --select src/porting/query-insights-selection.yml \
#     --out datasets/query-insights.yml
#
# Each reference is rewritten by hand from the source. It keeps the causes
# and recommendations, and drops the lifetime totals and any metric the slow
# log lines do not show, such as bytes read.
cases:
  - file: case_14_synthetic.json
    reference:
      queryOverview: "This aggregation matches admissions by `exhibitionId`
        equal to a string value. It then uses `$lookup` to join
        `visitorMemberships` on `visitorId`."
      areasWorthInvestigating:
        - leadSentence: "The `$lookup` stage is the likely main cost."
          elaboration: "The `$match` is supported by an index, but each
            admission is joined with several membership documents, so the
            join multiplies the documents the pipeline processes. Consider a
            `$limit` stage before the `$lookup` if the application does not
            need every result."
        - leadSentence: "Consider whether embedding the membership data would
            fit better than a repeated join."
          elaboration: "If memberships are usually read together with the
            admission, storing them in the same document would remove the
            need for `$lookup`. See [Embedded Data in Your MongoDB Schema](https://www.mongodb.com/docs/manual/data-modeling/embedding)."

  - file: case_15_synthetic.json
    reference:
      queryOverview: "This query finds expense reports where `status` equals a
        string value and `department` equals a string value, sorted by
        `submittedAt` in descending order."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `department`, `status`, and `submittedAt`."
          elaboration: "Many index keys are examined for each document
            returned, so the current index is not selective for this query.
            The recommended index would lower the average working time. Review
            the index suggestion in the Performance Advisor."

  - file: case_16_synthetic.json
    reference:
      queryOverview: "This query finds tickets where `subject` matches a
        regular expression."
      areasWorthInvestigating:
        - leadSentence: "The `$regex` predicate does not narrow the index scan
            effectively."
          elaboration: "The index scan examines many keys, while every document
            it fetches is returned. Consider rewriting the `$regex` as a
            left-anchored prefix match if that fits your use case. Review [$regex index use](https://www.mongodb.com/docs/manual/reference/operator/query/regex/#index-use)
            for other ways to rewrite the predicate."
        - leadSentence: "Consider whether MongoDB Search is a better fit for
            this query."
          elaboration: "For text search that goes beyond simple pattern checks,
            MongoDB Search can be a better fit than `$regex` or `$text`. Review
            [MongoDB Search Query Performance](https://www.mongodb.com/docs/search/performance/query-performance/?deployment-type=atlas#use-search-instead-of-text-or-regex)."

  - file: case_17_synthetic.json
    reference:
      queryOverview: "This query finds tasks where `assigneeId` equals a string
        value and `storyPoints` is at least a number value, sorted by
        `updatedAt` in descending order."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `assigneeId`, `updatedAt`, and `storyPoints`."
          elaboration: "The query targets documents efficiently, since every
            document examined is returned. The sort runs in memory, though. The
            recommended index includes the sort field, so it would avoid the
            in-memory sort. Review the index suggestion in the Performance
            Advisor."

  - file: case_19_synthetic.json
    reference:
      queryOverview: "This query finds tasks where `taskType` equals a string
        value and the `archivedAt` field exists."
      areasWorthInvestigating:
        - leadSentence: "The query does a collection scan because no index is
            used."
          elaboration: "Adding the right index will help. Consider a [partial
            index](https://www.mongodb.com/docs/manual/core/index-partial/)
            that supports the `$exists` predicate."

  - file: case_21_synthetic.json
    reference:
      queryOverview: "This query finds orders where `status` equals a string
        value, sorted by `createdAt` in descending order. It then skips a
        number of documents and limits the results."
      areasWorthInvestigating:
        - leadSentence: "Deep `skip()` pagination is the likely cost."
          elaboration: "The index keys examined are consistent with skipping
            through many results before returning any. Consider using a range
            query instead of `skip()` for pagination. See [Using Range Queries](https://www.mongodb.com/docs/manual/reference/method/cursor.skip#using-range-queries)."

  - file: case_22_synthetic.json
    reference:
      queryOverview: "This query finds tasks where `assigneeId` equals a string
        value or `watcherId` equals a string value."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `watcherId`."
          elaboration: "The query did a collection scan because no index was
            used. The suggested index removes the collection scan only if every
            `$or` branch is supported by an index, so check whether the
            `assigneeId` branch has one. Review the index suggestion in the
            Performance Advisor."

  - file: case_23_synthetic.json
    reference:
      queryOverview: "This query finds tasks where `assigneeId` equals a string
        value or `reporterId` equals a string value. It then sorts by
        `updatedAt` in descending order and limits the results."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `reporterId` and `updatedAt`."
          elaboration: "The query sorts in memory, so the matching results are
            read and sorted before the limit is applied. A top-level `$or` can
            avoid an in-memory sort when every branch is supported by an index
            that also supports the sort order. Review the index suggestion in
            the Performance Advisor, and check whether the `assigneeId` branch
            would be supported as well."

  - file: case_24_synthetic.json
    reference:
      queryOverview: "This query finds orders where `promoCode` matches any
        string value in the array."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `promoCode`."
          elaboration: "The query did a collection scan because no index was
            used. Review the index suggestion in the Performance Advisor."

  - file: case_25_synthetic.json
    reference:
      queryOverview: "This aggregation matches documents where `moduleId` equals
        a string value. It then sorts by `completedAt` in descending order and
        limits the results."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `moduleId` and `completedAt`."
          elaboration: "An index is used, but the query performs an in-memory
            sort. An in-memory sort is less efficient because MongoDB has to
            sort the matching results in memory instead of reading them in index
            order. The recommended index would eliminate the in-memory sort.
            Review the index suggestion in the Performance Advisor."

  - file: case_26_synthetic.json
    reference:
      queryOverview: "This query finds tickets where `status` equals a string
        value."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `status`, `tenantId`, `userId`, and `createdAt`."
          elaboration: "The query did a collection scan because no index was
            used, and the recommended index would remove it. The index includes
            fields this query does not filter on, so it may also serve other
            queries. Review the index suggestion in the Performance Advisor."

  - file: case_27_synthetic.json
    reference:
      queryOverview: "This aggregation matches documents where `moduleId` equals
        a string value. It then groups documents by `lessonId`, sums a numeric
        constant into `attempts`, and averages `score` values into `avgScore`."
      areasWorthInvestigating:
        - leadSentence: "The query did a collection scan because no index is
            used."
          elaboration: "Adding the right index will help, since it reduces the
            number of documents that reach the `$group` stage. Review the
            [Indexing Strategies](https://www.mongodb.com/docs/manual/applications/indexes/) guide."

  - file: case_28_synthetic.json
    reference:
      queryOverview: "This aggregation uses `$match` with `$text` to search for
        the specified string and options. It projects `subject` and a few other
        fields, adds a text relevance `score` with `$meta` textScore, sorts by
        that score in descending order, and limits the results."
      areasWorthInvestigating:
        - leadSentence: "Consider whether MongoDB Search would be a better fit
            for this query."
          elaboration: "The query uses an index but sorts its results in memory
            by text relevance. For ranked text search, MongoDB Search can be a
            better fit than `$text`. Review [MongoDB Search Query Performance](https://www.mongodb.com/docs/search/performance/query-performance/?deployment-type=atlas#use-search-instead-of-text-or-regex)."

  - file: case_29_synthetic.json
    reference:
      queryOverview: "This query finds documents where the value at the field
        path `items.quantity` is at least the specified number."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `items.quantity`."
          elaboration: "The query did a collection scan because no index was
            used. Review the index suggestion in the Performance Advisor."

  - file: case_30_synthetic.json
    reference:
      queryOverview: "This query sorts all documents by `startedAt` and
        `completedAt`, both in ascending order, and limits the results."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `startedAt` and `completedAt`."
          elaboration: "The query did a collection scan, which also led to an
            in-memory sort. The recommended index supports both sort fields in
            the same direction and would eliminate the in-memory sort. Review
            the index suggestion in the Performance Advisor."

  - file: case_31_synthetic.json
    reference:
      queryOverview: "This query finds documents where `device` equals a string
        value. It sorts by `startedAt` then `completedAt` in ascending order,
        followed by `score` in descending order, and limits the results."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `device`, `startedAt`, `completedAt`, and `score`."
          elaboration: "An index is used, but the query performs an in-memory
            sort. The recommended index supports the full sort order and would
            eliminate the in-memory sort. Review the index suggestion in the
            Performance Advisor."

  - file: case_32_synthetic.json
    reference:
      queryOverview: "This query finds articles where the `comments.tags` array
        has an element with `type` equal to a string value and `value` equal to
        a string value. It then sorts by `viewCount` in descending order and
        limits the results."
      areasWorthInvestigating:
        - leadSentence: "The query targets documents fairly efficiently, so the
            cost may be in the documents themselves."
          elaboration: "Targeting is fairly efficient, with few documents
            examined for each document returned. Large documents with unbounded
            arrays would explain a high read cost, but the slow log lines do not
            report bytes read, so the report should not claim it. Review the
            [unbounded arrays anti-pattern](https://www.mongodb.com/docs/manual/data-modeling/design-antipatterns/unbounded-arrays/)
            to see how this can be addressed."

  - file: case_33_synthetic.json
    reference:
      queryOverview: "This aggregation uses `$collStats` with `storageStats` to
        return collection storage statistics, including index-related metrics."
      areasWorthInvestigating:
        - leadSentence: "No investigation is needed."
          elaboration: "This is a relatively inexpensive introspection stage
            that does not scan documents. It is useful for operational
            monitoring of collection and index growth. See the [$collStats
            aggregation stage](https://www.mongodb.com/docs/manual/reference/operator/aggregation/collstats)."

  - file: case_34_synthetic.json
    reference:
      queryOverview: "This query matches all documents, sorts them by
        `amountCents` in ascending order, and limits them to the top results."
      areasWorthInvestigating:
        - leadSentence: "The Performance Advisor recommends an index on
            `amountCents`."
          elaboration: "The query did a collection scan and an in-memory sort.
            The recommended index would lower the average working time by
            avoiding both. Review the index suggestion in the Performance
            Advisor."

  # Combined: several shapes on one cluster, so the report has to cover them
  # together. Each reference is written for the whole set, in priority order.
  - files: [case_22_synthetic.json, case_24_synthetic.json, case_29_synthetic.json]
    id: multi-01
    expectedShapes: 3
    reference:
      queryOverview: "Three query shapes on this cluster, all doing collection
        scans. Ranked by documents examined, the `$or` query on
        `taskManagement.tasksOrUnindexedBranch` is the heaviest, then the `$in`
        query on `orderFulfillment.ordersUnindexedIn`, then the nested array
        query on `orderFulfillment.ordersNestedArray`."
      areasWorthInvestigating:
        - leadSentence: "The `$or` query on `taskManagement.tasksOrUnindexedBranch`
            is the largest cost, and the Performance Advisor recommends an index
            on `watcherId`."
          elaboration: "The suggested index removes the collection scan only if
            every `$or` branch is supported, so check whether the `assigneeId`
            branch has one. Review the index suggestion in the Performance
            Advisor."
        - leadSentence: "The Performance Advisor recommends an index on
            `promoCode` for `orderFulfillment.ordersUnindexedIn`."
          elaboration: "The query did a collection scan because no index was
            used. Review the index suggestion in the Performance Advisor."
        - leadSentence: "The Performance Advisor recommends an index on
            `items.quantity` for `orderFulfillment.ordersNestedArray`."
          elaboration: "The query did a collection scan because no index was
            used. Review the index suggestion in the Performance Advisor."

  # Four shapes, so the report covers the top three and leaves out the lightest.
  - files: [case_22_synthetic.json, case_19_synthetic.json, case_24_synthetic.json, case_26_synthetic.json]
    id: multi-02
    expectedShapes: 3
    reference:
      queryOverview: "Four query shapes on this cluster, all doing collection
        scans. The three heaviest are covered. The lightest, a status filter on
        `supportPortal.ticketsExtraKeysStatus`, is left out, as the report can
        cover only three shapes."
      areasWorthInvestigating:
        - leadSentence: "The `$or` query on `taskManagement.tasksOrUnindexedBranch`
            is the heaviest, and the Performance Advisor recommends an index on
            `watcherId`."
          elaboration: "The suggested index removes the collection scan only if
            every `$or` branch is supported, so check whether the `assigneeId`
            branch has one. Review the index suggestion in the Performance
            Advisor."
        - leadSentence: "The `find` on `taskManagement.tasksUnindexedArchived`
            does a collection scan because no index is used."
          elaboration: "Adding the right index will help. Consider a partial
            index that supports the `$exists` predicate."
        - leadSentence: "The Performance Advisor recommends an index on
            `promoCode` for `orderFulfillment.ordersUnindexedIn`."
          elaboration: "The query did a collection scan because no index was
            used. Review the index suggestion in the Performance Advisor."

  # The lightest shape comes first in the sample, so the report must rank the
  # heaviest one ahead of it, not follow the order of the slow logs.
  - files: [case_26_synthetic.json, case_27_synthetic.json, case_19_synthetic.json]
    id: multi-03
    expectedShapes: 3
    reference:
      queryOverview: "Three query shapes on this cluster, all doing collection
        scans. Ranked by documents examined, the `archivedAt` query on
        `taskManagement.tasksUnindexedArchived` is the heaviest, then the
        `$group` aggregation on `languageLearning.lessonAttemptsGroupByLesson`,
        then the status filter on `supportPortal.ticketsExtraKeysStatus`."
      areasWorthInvestigating:
        - leadSentence: "The query on `taskManagement.tasksUnindexedArchived`
            does a collection scan because no index is used."
          elaboration: "Consider a partial index that supports the `$exists`
            predicate on `archivedAt`. The Performance Advisor has no suggestion
            for this shape."
        - leadSentence: "The aggregation on
            `languageLearning.lessonAttemptsGroupByLesson` does a collection scan
            because no index is used."
          elaboration: "Adding the right index will help, since it reduces the
            documents that reach the `$group` stage. The Performance Advisor has
            no suggestion for this shape."
        - leadSentence: "The Performance Advisor recommends an index on
            `status`, `tenantId`, `userId`, and `createdAt` for
            `supportPortal.ticketsExtraKeysStatus`."
          elaboration: "The query did a collection scan, and the recommended
            index would remove it. The index includes fields this query does not
            filter on, so it may also serve other queries."
