# Source: mongodb_mcp_tools_db_read_only.yml, "list_databases_available"
- name: list_databases_available
  description: should call list-databases to enumerate the available databases
  tags:
    - list-databases
    - single-tool
  input:
    messages:
      - role: user
        content: What databases are available on this deployment?
    custom:
      defaultData:
        databaseName: sample_mflix
      toolSetup:
        localMongo: sample-mflix
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__list_databases
      - role: tool
      - role: assistant
