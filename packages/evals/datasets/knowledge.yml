# Source: version_q_and_a_conversations.yml, "source_misleading"
- name: Vector search on a 7.0 cluster
  description: Edge case - "vector-search" source only has current content. If we
    add a 7.0 filter, we won't get info. Should be able to answer anyway
  tags:
    - version
  input:
    messages:
      - role: user
        content: how do i do vector search in my mongodb 7.0 cluster
  expected:
    referenceAnswer: >-
      $vectorSearch is available in MongoDB Atlas clusters using MongoDB version
      7.0.2 or higher. Atlas Vector Search was not introduced until then. If
      you're running a self-managed MongoDB  7.0 deployment, regular
      `$vectorSearch` support is not supported. You may need to upgrade to a
      newer MongoDB version to be able to use $vectorSearch if you're
      self-managed.

      A semantic search workflow looks like this:

      - Generate embeddings for your documents - Store the embeddings in a field
      in your collection - Create a vector search index on that field - Run
      `$vectorSearch` with a query embedding to find results by meaning, not
      just exact keywords
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
# Source: version_q_and_a_conversations.yml, "new_feature_this_version"
- name: Spark Connector 10.3 multi-collection streams
  description: multi-collection streaming reads were added in Spark Connector 10.3
  tags:
    - legacy_content_search
    - version
  input:
    messages:
      - role: user
        content: How do I read from more than one collection in a single stream with the
          MongoDB Spark Connector 10.3?
  expected:
    referenceAnswer: 'Spark Connector 10.3 added support for reading multiple
      collections in micro-batch and continuous streaming modes; you list the
      collection names, comma-separated, in the `collection` read option. For
      example: `df =
      spark.readStream.format("mongodb").option("spark.mongodb.connection.uri",
      "<uri>").option("spark.mongodb.database",
      "sales").option("spark.mongodb.collection",
      "orders,returns,refunds").load()`. Because 10.3 parses those names
      specially, any literal comma, asterisk, or backslash within a collection
      name must be escaped with a backslash (e.g. a collection named `a,b` is
      written `a\,b`). Multi-collection streaming reads are new in 10.3.'
    links:
      - https://www.mongodb.com/docs/spark-connector/v10.x/release-notes/
      - https://www.mongodb.com/docs/spark-connector/v10.x/streaming-mode/streaming-read/
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
