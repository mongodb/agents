# Source: deprecated_product_conversations.yml, "EAI-2322"
- name: EAI-2322
  tags:
    - deprecated
    - monitor-for-regression
  input:
    messages:
      - role: user
        content: Has atlas data api been deprecated
  expected:
    referenceAnswer: >-
      Yes, the Atlas Data API has been deprecated. MongoDB officially announced
      the deprecation with complete removal scheduled for September 30, 2025.


      MongoDB deprecated the entire Atlas App Services platform, which includes
      the Atlas Data API, Custom HTTPS Endpoints, Device Sync & Realm SDKs,
      GraphQL API, Functions, Static Hosting, and Edge Server. Atlas App
      Services has reached its end-of-life status and is no longer actively
      supported by MongoDB.


      # Alternative Solutions:


      MongoDB suggests several alternatives for migrating away from the Data
      API:


      * Self-managed solutions: Leverage MongoDB Drivers with a native language
      framework to create REST APIs in your self-managed app stack, such as
      Express with the MongoDB native node driver

      * Drop-in replacements: Delbridge offers a free, open-source Data API that
      serves as a drop-in replacement for the deprecated Atlas Data API

      * Third-party tools: MongoDB recommends RESTHeart among the alternative
      solutions
    links:
      - https://www.mongodb.com/docs/atlas/app-services/data-api
      - https://www.mongodb.com/docs/atlas/app-services/data-api/data-api-deprecation
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
# Source: deprecated_product_conversations.yml, "EAI-2377"
- name: EAI-2377
  tags:
    - deprecated
    - monitor-for-regression
  input:
    messages:
      - role: user
        content: which backup options exist for MongoDB serverless clusters?
  expected:
    referenceAnswer: >-
      MongoDB Atlas Serverless instances are deprecated and no longer have
      backup options in the current product. Existing Serverless instances were
      migrated to Free, Flex, or Dedicated clusters depending on usage. What
      that means in practice: 


      * No current backup configuration for Serverless 

      * The old `serverlessContinuousBackupEnabled` setting is **deprecated** 

      * Continuous Cloud Backup is no longer supported for Serverless instances 


      If you are looking for the replacement backup choices, they depend on the
      cluster type Atlas migrated you to: 


      * Flex clusters: automatic daily snapshots only, no on-demand snapshots,
      no custom backup policies 

      * Dedicated `M10+` clusters: Cloud Backup (scheduled snapshots) or
      Continuous Cloud Backup for point-in-time restore 

      * Free clusters: no Atlas backups; use `mongodump` and `mongorestore` for
      manual backup and restore 


      So the short answer is: **Serverless clusters themselves do not offer
      active backup options anymore; the supported backup choices now live on
      Flex or Dedicated clusters instead.**
    links:
      - mongodb.com/docs/atlas/operator/current/ak8so-back-up-deployment
      - learn.mongodb.com/learn/article/choosing-the-right-atlas-backup-policy
      - mongodb.com/docs/atlas/backup-restore-cluster
      - learn.mongodb.com/learn/course/cluster-reliability/cluster-reliability/restoring-data-from-backups
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
