- name: Go 1.17 WriteNull error
  description: No current explanation; There is no FAQ page under
    drivers/go/current, only v1.x FAQ explains.
  tags:
    - version
    - no-current-source
  input:
    messages:
      - role: user
        content: >
          Go driver 1.17 is throwing "WriteNull can only write while positioned
          on a Element or Value but is positioned on a TopLevel" from a
          FindOneAndUpdate. What causes this?
  expected:
    referenceAnswer: That error means a non-document value reached `bson.Marshal()`.
      A common cause is passing a nil `bson.D` as a sort to `SetSort()`, which
      marshals as null and produces `WriteNull`. Passing a string, bool, or int
      produces the analogous `WriteString`, `WriteBoolean`, or `WriteInt32`
      errors. Initialize the value as `bson.D{}` instead of leaving it nil.
    links:
      - https://www.mongodb.com/docs/drivers/go/v1.x/faq/
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
