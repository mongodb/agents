  description: Kafka Connector 2.0.3 changed TLS to prefer v1.3
  tags:
    - legacy_content_search
    - version
  input:
    messages:
      - role: user
        content: We're deploying the MongoDB Kafka Connector 2.0.3 with TLS enabled.
          Which TLS protocol versions will it use when connecting?
  expected:
    referenceAnswer: MongoDB Kafka Connector 2.0.3 changed TLS behavior to
      explicitly prefer TLS v1.3, falling back to TLS v1.2. TLS 1.3 is the
      preferred protocol and TLS 1.2 as a fallback if TLS 1.3 is unavailable. If
      neither TLS 1.3 nor TLS 1.2 is available, the connector's
      getSecureSslContext() method throws a NoSuchAlgorithmException.
