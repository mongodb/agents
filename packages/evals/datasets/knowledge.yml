# Source: conversations.yml, "Aware of Atlas Vercel Integration"
- name: Aware of Atlas Vercel Integration
  tags:
    - atlas
  input:
    messages:
      - role: user
        content: does atlas connect with vercel?
  expected:
    referenceAnswer: >-
      MongoDB Atlas does connect with Vercel. There are two integration options:

      - Native Integration: Find MongoDB Atlas in the Vercel Marketplace and
      create a new MongoDB Atlas account. Cluster provisioning and billing are
      conducted through Vercel.

      - Connectable Accounts Integration: You can link an existing Atlas account
      to your Vercel account. You must manage your Atlas account, billing, and
      resource provisioning outside of Vercel.
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
# Source: conversations.yml, "Should explain how to connect to MongoDB Atlas from the Node.js driver"
- name: Should explain how to connect to MongoDB Atlas from the Node.js driver
  description: The ASSISTANT should provide a Node.js example of how to connect to
    MongoDB Atlas.
  tags:
    - driver
    - javascript
  input:
    messages:
      - role: user
        content: Can you walk me through connecting to atlas on the node driver?
  expected:
    referenceAnswer: >-
      To connect to your MongoDB Atlas cluster using the Node.js driver:


      1. Install the MongoDB Node.js driver with npm:


      npm install mongodb


      2. Get your Atlas connection string from the Atlas UI.


      3. In your Javascript or Typescript code, use the MongoClient class to
      connect to your cluster.


      ```js


      import { MongoClient } from "mongodb";


      // Replace <connection-string> with your actual Atlas connection string

      const uri = "<connection-string>";


      const client = new MongoClient(uri);


      async function run() {
        try {
            await client.connect();
            // Access your database and collections
            const database = client.db(<database-name>);
            const collection = database.collection(<collection-name>);
            // Example: Find one document
            const result = await collection.findOne();
            console.log(result);
        } finally {
            await client.close();
        }
      }


      run().catch(console.error);


      ```

      Please note that you need to replace `<connection string uri>` and
      placeholder database object names with the information from your MongoDB
      deployment.
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
# Source: conversations.yml, "Should know the syntax to a $group aggregation stage"
- name: Should know the syntax to a $group aggregation stage
  tags:
    - server
    - aggregation
  input:
    messages:
      - role: user
        content: What is the syntax for a $group agg stage?
  expected:
    referenceAnswer: >-
      This is the basic syntax for a $group aggregation stage:

      ``` {
        $group: {
          _id: <expression>,
          <field1>: { <accumulator1> : <expression1> },
          ...
        }
      } ```

      _id Defines the group key. Documents with the same value for this
      expression are grouped together. Additional fields are optional. Use
      accumulator operators like $sum, $avg, $max, $min, $push, $addToSet, etc.
      to calculate aggregate values for each group.

      <EVALUATION>An example may be included using the above syntax, but it is
      optional.</EVALUATION>
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
# Source: conversations.yml, "Should know how to choose the order of fields when creating a compound index"
- name: Should know how to choose the order of fields when creating a compound index
  tags:
    - server
    - indexes
  input:
    messages:
      - role: user
        content: How do I choose the order of fields when creating a compound index?;
  expected:
    referenceAnswer: >-
      To create compound indexes with optimized performance, use the ESR rule:
      place fields used in equality test first,  then fields used for sort
      operations, and lastly fields used for range queries.

       Example:
      ```json db.collection.createIndex({"equalityField": 1, "sortField": 1,
      "rangeField": 1}); ```

      <optional-content> For complex cases, consider the following guidelines:
      1. **Selectivity**: Place fields with high selectivity (many unique
      values) earlier in the index. 2. **Covering Queries**: Include fields used
      in the query projection to enable covered queries. 3. **Index Size & Write
      Impact**: Be mindful of the size of the index and the impact on write
      operations. 4. **Usage**: Monitor and adjust indexes based on actual usage
      metrics and performance analysis. </optional-content>
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
# Source: conversations.yml, "Search for 'and operator'"
- name: Search for 'and operator'
  tags:
    - top_query
  input:
    messages:
      - role: user
        content: and operator mongodb
  expected:
    referenceAnswer: >-
      The $and operator in MongoDB performs a logical AND operation on an array
      of conditions. A document matches if all conditions are true.


      Syntax:


      { "$and": [ { <condition1> }, { <condition2> }, ... ] }


      Example:


      Find documents where age > 25 and status = "active":


      db.users.find({
        $and: [
          { age: { $gt: 25 } },
          { status: "active" }
        ]
      });


      Equivalent implicit form:


      db.users.find({ age: { $gt: 25 }, status: "active" });


      When to Use $and:
        •	Multiple conditions on the same field:
      { $and: [ { age: { $gt: 25 } }, { age: { $lt: 35 } } ] }
        •	Dynamic query construction.
        •	Combining with other operators:

      db.users.find({
        $and: [
          { age: { $gt: 25 } },
          { $or: [ { status: "active" }, { role: "admin" } ] }
        ]
      });
    links:
      - reference/operator/query/and
      - reference/operator/aggregation/and
      - reference/operator/query/all
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
