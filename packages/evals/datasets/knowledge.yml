# Source: conversations.yml, "Should know that you can use the $add operator to add the value of fields together"
- name: Should know that you can use the $add operator to add the value of fields
    together
  tags:
    - top_query
    - server
    - aggregation
  input:
    messages:
      - role: user
        content: How do I add values of fields together?
  expected:
    referenceAnswer: >-
      You can use aggregations with the $add operator to add the value of fields
      together. Here is an example

      ```

      db.collection.aggregate([
        {
          $project: {
            total: { $add: ["$field1", "$field2"] }
          }
        }
      ])

      ```

      Replace $field1 and $field2 with the field names that you want to add
      together for each document.

      In this example, the result will have a new field called total that
      contains the sum.
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: search_knowledge
      - role: tool
      - role: assistant
