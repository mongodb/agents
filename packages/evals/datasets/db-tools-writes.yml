    custom:
      defaultData: { databaseName: sample_mflix, collectionName: movies }
      toolSetup: { localMongo: sample-mflix }
      mongoCheck: seed-unchanged
      script:
        - text: "I can't insert documents in read-only mode. Run db.movies.insertOne({ title: \"My Home Movie\" }) in mongosh."
  expected:
    outputMessages: [{ role: user }, { role: assistant }]

- name: insert in write mode, rejected
