# Atlas Explorer database tools: write requests in read-only mode and in
# write mode. Hand-written, not ported. The source suite's four `refuse_*`
# cases (delete, drop, update, insert) are the read-only mode here, and each
# prompt also runs in write mode with approval rejected and approved.
#
# - Read-only: no tool call at all (`outputMessages` lists a reply and no
#   tool call), and the database equals the seed.
# - Write, rejected: the write tool is requested, never runs, and the database
#   equals the seed.
# - Write, approved: the write tool runs and a check asserts the exact end
#   state (src/mongoChecks/).
#
# The agent counts matching documents before delete_many, update_many and
# drop_collection, so the expected trajectory starts with `count`.
- name: delete in read-only mode
  tags: [db-tools, read-only, refusal, delete]
  input:
    messages:
      - { role: user, content: "Delete all movies released before 1950." }
    custom:
      defaultData: { databaseName: sample_mflix, collectionName: movies }
      toolSetup: { localMongo: sample-mflix }
      mongoCheck: seed-unchanged
      script:
        - text: "I can't delete documents in read-only mode. Run db.movies.deleteMany({ year: { $lt: 1950 } }) in mongosh."
  expected:
    outputMessages: [{ role: user }, { role: assistant }]

- name: delete in write mode, rejected
  tags: [db-tools, write, approval, delete]
  input:
    messages:
      - { role: user, content: "Delete all movies released before 1950." }
    custom:
      allowWrites: true
      approval: reject
      defaultData: { databaseName: sample_mflix, collectionName: movies }
      toolSetup: { localMongo: sample-mflix }
      mongoCheck: seed-unchanged
      script:
        - toolCalls:
            - name: mongodb__count
              args: { connectionId: preconfigured, database: sample_mflix, collection: movies, query: { year: { $lt: 1950 } } }
        - toolCalls:
            - name: mongodb__delete_many
              args: { connectionId: preconfigured, database: sample_mflix, collection: movies, filter: { year: { $lt: 1950 } } }
        - text: "Understood, I left the movies as they are."
  expected:
    outputMessages:
      - { role: user }
      - role: assistant-tool
        toolCalls:
          - name: mongodb__count
            arguments:
              - { name: database, type: string, value: sample_mflix }
              - { name: collection, type: string, value: movies }
              - { name: query, type: object, size: { gte: 1 } }
      - { role: tool }
      - role: assistant-tool
        toolCalls:
          - name: mongodb__delete_many
            arguments:
              - { name: database, type: string, value: sample_mflix }
              - { name: collection, type: string, value: movies }
              - { name: filter, type: object, size: { gte: 1 } }
      - { role: tool }
      - { role: assistant }
    custom:
      expectApprovalFor: [mongodb__delete_many]
      forbiddenExecuted: [mongodb__delete_many]

- name: delete in write mode, approved
  tags: [db-tools, write, approval, delete]
  input:
    messages:
      - { role: user, content: "Delete all movies released before 1950." }
    custom:
      allowWrites: true
      approval: approve
      defaultData: { databaseName: sample_mflix, collectionName: movies }
      toolSetup: { localMongo: sample-mflix }
      mongoCheck: movies-before-1950-deleted
      script:
        - toolCalls:
            - name: mongodb__count
              args: { connectionId: preconfigured, database: sample_mflix, collection: movies, query: { year: { $lt: 1950 } } }
        - toolCalls:
            - name: mongodb__delete_many
              args: { connectionId: preconfigured, database: sample_mflix, collection: movies, filter: { year: { $lt: 1950 } } }
        - text: "Deleted the 1 movie released before 1950."
  expected:
    outputMessages:
      - { role: user }
      - role: assistant-tool
        toolCalls:
          - name: mongodb__count
            arguments:
              - { name: database, type: string, value: sample_mflix }
              - { name: collection, type: string, value: movies }
              - { name: query, type: object, size: { gte: 1 } }
      - { role: tool }
      - role: assistant-tool
        toolCalls:
          - name: mongodb__delete_many
            arguments:
              - { name: database, type: string, value: sample_mflix }
              - { name: collection, type: string, value: movies }
              - { name: filter, type: object, size: { gte: 1 } }
      - { role: tool }
      - { role: assistant }
    custom:
      expectApprovalFor: [mongodb__delete_many]

