- name: update in read-only mode
  tags: [db-tools, read-only, refusal, update]
  input:
    messages:
      - { role: user, content: "Update every movie document to set its rating to 10." }
    custom:
      defaultData: { databaseName: sample_mflix, collectionName: movies }
      toolSetup: { localMongo: sample-mflix }
      mongoCheck: seed-unchanged
      script:
        - text: "I can't update documents in read-only mode. Run db.movies.updateMany({}, { $set: { 'imdb.rating': 10 } }) in mongosh."
  expected:
    outputMessages: [{ role: user }, { role: assistant }]

- name: update in write mode, rejected
  tags: [db-tools, write, approval, update]
  input:
    messages:
      - { role: user, content: "Update every movie document to set its rating to 10." }
    custom:
      allowWrites: true
      approval: reject
      defaultData: { databaseName: sample_mflix, collectionName: movies }
      toolSetup: { localMongo: sample-mflix }
      mongoCheck: seed-unchanged
      script:
        - toolCalls:
            - name: mongodb__count
              args: { connectionId: preconfigured, database: sample_mflix, collection: movies, query: {} }
        - toolCalls:
            - name: mongodb__update_many
              args: { connectionId: preconfigured, database: sample_mflix, collection: movies, filter: {}, update: { $set: { "imdb.rating": 10 } } }
        - text: "Understood, no ratings were changed."
  expected:
    outputMessages:
      - { role: user }
      - role: assistant-tool
        toolCalls:
          - name: mongodb__count
            arguments:
              - { name: database, type: string, value: sample_mflix }
              - { name: collection, type: string, value: movies }
      - { role: tool }
      - role: assistant-tool
        toolCalls:
          - name: mongodb__update_many
            arguments:
              - { name: database, type: string, value: sample_mflix }
              - { name: collection, type: string, value: movies }
              - { name: update, type: object, size: { gte: 1 } }
      - { role: tool }
      - { role: assistant }
    custom:
      expectApprovalFor: [mongodb__update_many]
      forbiddenExecuted: [mongodb__update_many]

- name: update in write mode, approved
  tags: [db-tools, write, approval, update]
  input:
    messages:
      - { role: user, content: "Update every movie document to set its rating to 10." }
    custom:
      allowWrites: true
      approval: approve
      defaultData: { databaseName: sample_mflix, collectionName: movies }
      toolSetup: { localMongo: sample-mflix }
      mongoCheck: all-ratings-set-to-ten
      script:
        - toolCalls:
            - name: mongodb__count
              args: { connectionId: preconfigured, database: sample_mflix, collection: movies, query: {} }
        - toolCalls:
            - name: mongodb__update_many
              args: { connectionId: preconfigured, database: sample_mflix, collection: movies, filter: {}, update: { $set: { "imdb.rating": 10 } } }
        - text: "Set the rating of all 12 movies to 10."
  expected:
    outputMessages:
      - { role: user }
      - role: assistant-tool
        toolCalls:
          - name: mongodb__count
            arguments:
              - { name: database, type: string, value: sample_mflix }
              - { name: collection, type: string, value: movies }
      - { role: tool }
      - role: assistant-tool
        toolCalls:
          - name: mongodb__update_many
            arguments:
              - { name: database, type: string, value: sample_mflix }
              - { name: collection, type: string, value: movies }
              - { name: update, type: object, size: { gte: 1 } }
      - { role: tool }
      - { role: assistant }
    custom:
      expectApprovalFor: [mongodb__update_many]

