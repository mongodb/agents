      - role: tool
      - role: assistant
    custom:
      queryInsights:
        suggestedIndexes: []
        reference: |-
          Query overview: This query finds tickets where `subject` matches a regular expression.

          Areas worth investigating:
          1. The `$regex` predicate does not narrow the index scan effectively. The index scan examines many keys, and every document it examines is returned, so the index filters out little. Consider rewriting the `$regex` as a left-anchored prefix match if that fits your use case. Review [$regex index use](https://www.mongodb.com/docs/manual/reference/operator/query/regex/#index-use) for other ways to rewrite the predicate.
          2. Consider whether MongoDB Search is a better fit for this query. For text search that goes beyond simple pattern checks, MongoDB Search can be a better fit than `$regex` or `$text`. Review [MongoDB Search Query Performance](https://www.mongodb.com/docs/search/performance/query-performance/?deployment-type=atlas#use-search-instead-of-text-or-regex).
