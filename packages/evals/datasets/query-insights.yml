# Atlas Query Insights cases converted from the source eval cases.
# Generated by `pnpm port:query-insights`.
# Each case reads a mock Atlas seed of the same name in fixtures/atlas.

- name: query-insights-case-14
  tags:
    - aggregate
    - no-advisor-index
  input:
    messages:
      - role: user
        content: Why are my queries slow on Cluster0?
    custom:
      defaultData:
        projectId: 6a0000000000000000000001
        clusterName: Cluster0
      toolSetup:
        mockAtlas: query-insights-case-14
      script:
        - toolCalls:
            - name: mongodb__atlas_get_performance_advisor
              args:
                projectId: 6a0000000000000000000001
                clusterName: Cluster0
        - text: Scripted reply for offline runs. A real model writes the report.
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_get_performance_advisor
            arguments:
              - name: projectId
                type: string
                value: 6a0000000000000000000001
              - name: clusterName
                type: string
                value: Cluster0
      - role: tool
      - role: assistant
    custom:
      queryInsights:
        suggestedIndexes: []
        reference: >-
          Query overview: This aggregation matches admissions by `exhibitionId`
          equal to a string value. It then uses `$lookup` to join
          `visitorMemberships` on `visitorId`.


          Areas worth investigating:

          1. The `$lookup` stage is the likely main cost. The `$match` is
          supported by an index, but each admission is joined with several
          membership documents, so the join multiplies the documents the
          pipeline processes. Consider a `$limit` stage before the `$lookup` if
          the application does not need every result.

          2. Consider whether embedding the membership data would fit better
          than a repeated join. If memberships are usually read together with
          the admission, storing them in the same document would remove the need
          for `$lookup`. See [Embedded Data in Your MongoDB
          Schema](https://www.mongodb.com/docs/manual/data-modeling/embedding).
