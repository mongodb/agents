# Source: getPerformanceAdvisor.test.ts, "Can you give me index suggestions for the database 'mflix' in the project named 'mflix' and cluster ..."
- name: gets suggested indexes
  tags:
    - ported
    - read
    - advisor
  input:
    messages:
      - role: user
        content: Can you give me index suggestions for the database 'mflix' in the
          project named 'mflix' and cluster 'mflix-cluster'?
    custom:
      toolSetup:
        mockAtlas: mflix-advisor
      script:
        - toolCalls:
            - name: mongodb__atlas_get_performance_advisor
              args:
                projectId: 68f600519f16226591d054c0
                clusterName: mflix-cluster
                operations:
                  - suggestedIndexes
        - text: "Index suggestions: mflix.movies on title and year, and mflix.shows on
            genre and rating."
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_get_performance_advisor
            arguments:
              - name: projectId
                type: string
                value: 68f600519f16226591d054c0
              - name: clusterName
                type: string
                value: mflix-cluster
              - name: operations
                type: array
                value:
                  - suggestedIndexes
      - role: tool
      - role: assistant
    custom:
      answerMatches:
        - mflix\.movies
