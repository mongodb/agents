    - pause-resume
  input:
    messages:
      - role: user
        content: Pause cluster prod-cluster in project 9123a4b056c7d890e1f2a3f4
    custom:
      allowWrites: true
      approval: approve
      toolSetup:
        mockAtlas: prod-cluster
      script:
        - toolCalls:
            - name: mongodb__atlas_pause_resume_cluster
              args:
                projectId: 9123a4b056c7d890e1f2a3f4
                clusterName: prod-cluster
                action: PAUSE
        - text: prod-cluster is being paused.
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_pause_resume_cluster
            arguments:
              - name: projectId
                type: string
                value: 9123a4b056c7d890e1f2a3f4
              - name: clusterName
                type: string
                value: prod-cluster
              - name: action
                type: string
                value: PAUSE
      - role: tool
      - role: assistant
    custom:
      expectApprovalFor:
        - mongodb__atlas_pause_resume_cluster
      answerMatches:
        - paus
