# Source: getRegions.test.ts, "List the atlas regions for AWS"
- name: lists AWS regions
  tags:
    - ported
    - read
    - regions
  input:
    messages:
      - role: user
        content: List the atlas regions for AWS
    custom:
      toolSetup:
        mockAtlas: one-project
      script:
        - toolCalls:
            - name: mongodb__atlas_get_regions
              args:
                provider: AWS
        - text: AWS has US_EAST_1 and many more regions.
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_get_regions
            arguments:
              - name: provider
                type: string
                value: AWS
      - role: tool
      - role: assistant
    custom:
      answerMatches:
        - US_EAST_1
