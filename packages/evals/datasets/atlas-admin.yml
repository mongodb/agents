    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_get_performance_advisor
            arguments:
              - name: projectId
                type: string
                value: 68f600519f16226591d054c0
              - name: clusterName
                type: string
                value: mflix-cluster
              - name: operations
                type: array
                value:
                  - slowQueryLogs
              - name: namespaces
                type: array
                value:
                  - mflix.movies
                  - mflix.shows
              - name: since
                type: string
                value: 2023-01-01T00:00:00Z
      - role: tool
      - role: assistant
    custom:
      answerMatches:
