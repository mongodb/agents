# Source: getRegions.test.ts, "What region should I use for Azure south america?"
- name: finds an Azure South America region
  tags:
    - ported
    - read
    - regions
  input:
    messages:
      - role: user
        content: What region should I use for Azure south america?
    custom:
      toolSetup:
        mockAtlas: one-project
      script:
        - toolCalls:
            - name: mongodb__atlas_get_regions
              args:
                provider: AZURE
        - text: Use BRAZIL_SOUTH for Azure in South America.
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_get_regions
            arguments:
              - name: provider
                type: string
                value: AZURE
      - role: tool
      - role: assistant
    custom:
      answerMatches:
        - BRAZIL_SOUTH|CHILE_CENTRAL
