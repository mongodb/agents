# Source: listAlerts.test.ts, "What alerts are currently firing on my Atlas project 68f600519f16226591d054c0?"
- name: lists open alerts by default
  tags:
    - ported
    - read
    - alerts
  input:
    messages:
      - role: user
        content: What alerts are currently firing on my Atlas project
          68f600519f16226591d054c0?
    custom:
      toolSetup:
        mockAtlas: alerts-open-closed
      script:
        - toolCalls:
            - name: mongodb__atlas_list_alerts
              args:
                projectId: 68f600519f16226591d054c0
        - text: "Two alerts are open: HOST_DOWN and REPLICATION_OPLOG_WINDOW_RUNNING_OUT."
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_list_alerts
            arguments:
              - name: projectId
                type: string
                value: 68f600519f16226591d054c0
      - role: tool
      - role: assistant
    custom:
      answerMatches:
        - host[_ ]down
# Source: listAlerts.test.ts, "Have any alerts on my Atlas project 68f600519f16226591d054c0 already been resolved? Show me the clos..."
- name: lists closed alerts when asked for resolved ones
  tags:
    - ported
    - read
    - alerts
  input:
    messages:
      - role: user
        content: Have any alerts on my Atlas project 68f600519f16226591d054c0 already
          been resolved? Show me the closed ones.
    custom:
      toolSetup:
        mockAtlas: alerts-open-closed
      script:
        - toolCalls:
            - name: mongodb__atlas_list_alerts
              args:
                projectId: 68f600519f16226591d054c0
                status: CLOSED
        - text: "One alert is closed: HOST_DOWN, resolved after restart."
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_list_alerts
            arguments:
              - name: projectId
                type: string
                value: 68f600519f16226591d054c0
              - name: status
                type: string
                matchRegex: ^[cC][lL][oO][sS][eE][dD]$
      - role: tool
      - role: assistant
    custom:
      answerMatches:
        - host[_ ]down
# Source: listAlerts.test.ts, "List the alert configuration settings defined for my Atlas project 68f600519f16226591d054c0 -- the r..."
- name: does not use list alerts for alert configurations
  tags:
    - ported
    - read
    - alerts
    - negative
  input:
    messages:
      - role: user
        content: List the alert configuration settings defined for my Atlas project
          68f600519f16226591d054c0 -- the rules that decide when an alert is
          raised, not the alerts that have already fired.
    custom:
      toolSetup:
        mockAtlas: alerts-open-closed
      script:
        - text: I have no tool that lists alert configurations.
  expected:
    outputMessages:
      - role: user
      - role: assistant
# Source: getPerformanceAdvisor.test.ts, "Can you give me index suggestions for the database 'mflix' in the project named 'mflix' and cluster ..."
- name: gets suggested indexes
  tags:
    - ported
    - read
    - advisor
  input:
    messages:
      - role: user
        content: Can you give me index suggestions for the database 'mflix' in the
          project named 'mflix' and cluster 'mflix-cluster'?
    custom:
      toolSetup:
        mockAtlas: mflix-advisor
      script:
        - toolCalls:
            - name: mongodb__atlas_get_performance_advisor
              args:
                projectId: 68f600519f16226591d054c0
                clusterName: mflix-cluster
                operations:
                  - suggestedIndexes
        - text: "Index suggestions: mflix.movies on title and year, and mflix.shows on
            genre and rating."
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_get_performance_advisor
            arguments:
              - name: projectId
                type: string
                value: 68f600519f16226591d054c0
              - name: clusterName
                type: string
                value: mflix-cluster
              - name: operations
                type: array
                value:
                  - suggestedIndexes
      - role: tool
      - role: assistant
    custom:
      answerMatches:
        - mflix\.movies
