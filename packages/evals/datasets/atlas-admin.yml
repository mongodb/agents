# Source: getPerformanceAdvisor.test.ts, "Show me the slow query logs for the project named 'mflix' and 'mflix-cluster' cluster for the namesp..."
- name: gets slow query logs for namespaces since a date
  tags:
    - ported
    - read
    - advisor
  input:
    messages:
      - role: user
        content: Show me the slow query logs for the project named 'mflix' and
          'mflix-cluster' cluster for the namespaces 'mflix.movies' and
          'mflix.shows' since January 1st, 2023
    custom:
      toolSetup:
        mockAtlas: mflix-advisor
      script:
        - toolCalls:
            - name: mongodb__atlas_get_performance_advisor
              args:
                projectId: 68f600519f16226591d054c0
                clusterName: mflix-cluster
                operations:
                  - slowQueryLogs
                namespaces:
                  - mflix.movies
                  - mflix.shows
                since: 2023-01-01T00:00:00Z
        - text: The slow queries are on mflix.movies and mflix.shows.
  expected:
    outputMessages:
      - role: user
      - role: assistant-tool
        toolCalls:
          - name: mongodb__atlas_get_performance_advisor
            arguments:
              - name: projectId
                type: string
                value: 68f600519f16226591d054c0
              - name: clusterName
                type: string
                value: mflix-cluster
              - name: operations
                type: array
                value:
                  - slowQueryLogs
              - name: namespaces
                type: array
                value:
                  - mflix.movies
                  - mflix.shows
              - name: since
                type: string
                value: 2023-01-01T00:00:00Z
      - role: tool
      - role: assistant
    custom:
      answerMatches:
        - mflix\.movies
