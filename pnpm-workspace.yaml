packages:
  - "agents/*"
  - "apps/*"
  - "packages/*"

overrides:
  "zod": "4.4.3"
  "@langchain/core": "1.2.12"
  # These agents declare file: dependencies so the npm install inside
  # `agentengine dev up` can parse package.json; pnpm links the workspace copies.
  "@repo/atlas-query-insights-agent": "workspace:*"
  "@repo/atlas-explorer-agent": "workspace:*"
  "@repo/agent-engine-core": "workspace:*"
  "@repo/agent-engine-chat": "workspace:*"

allowBuilds:
  esbuild: true
  # Transitive OpenTelemetry dependency. Its postinstall only warns about
  # versionScheme and is not required to load the package.
  protobufjs: false
  # Native optional deps of @mongodb-js/mcp-fetch / devtools-proxy-support.
  # Direct HTTPS to knowledge.mongodb.com does not need them.
  "@modelcontextprotocol/ext-apps": false
  cpu-features: false
  macos-export-certificate-and-key: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@mongodb-js/agent-engine-runner-shared@0.11.6'
  - '@mongodb-js/agent-engine-sdk-langgraph@0.11.6'
  - '@mongodb-js/agent-engine-sdk-memory@0.11.6'
  - '@mongodb-js/agent-engine-sdk@0.11.6'
