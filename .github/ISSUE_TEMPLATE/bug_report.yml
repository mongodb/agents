name: Bug Report
description: Report an issue with a MongoDB Agent template or app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix the problem.

  - type: input
    id: agent-or-component
    attributes:
      label: Agent or Component
      description: Which agent, app, or package is this issue related to?
      placeholder: e.g., atlas-explorer, atlas-query-insights, atlas-explorer-slack-bot
    validations:
      required: true

  - type: textarea
    id: task-description
    attributes:
      label: Task Description
      description: What were you trying to accomplish? Please provide your prompt or describe the workflow, removing any sensitive information.
      placeholder: "I was trying to..."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "I expected the agent to..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Instead, the agent..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Please provide clear steps to reproduce this issue
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: runtime-environment
    attributes:
      label: Runtime Environment
      description: Where and how were you running or invoking the agent?
      placeholder: e.g., Local Playground (agentengine dev up), Deployed on Atlas Agent Engine (agentengine invoke), Slack bot, etc.
    validations:
      required: true

  - type: input
    id: llm-model
    attributes:
      label: Model Provider & Model
      description: Which model provider and model is your agent configured to use?
      placeholder: e.g., openai / gpt-5.4, anthropic / claude-sonnet-4-6, google-genai / gemini-2.5-pro, etc.
    validations:
      required: true

  - type: input
    id: mongodb-version
    attributes:
      label: MongoDB Atlas Cluster Version & Tier
      description: What MongoDB version and Atlas cluster tier are you working with, if applicable?
      placeholder: e.g., MongoDB 8.0 (M10), MongoDB 7.0 (M30), M0 Free
    validations:
      required: false

  - type: input
    id: repo-version
    attributes:
      label: Repository Revision
      description: Which version of this repository are you using? (commit hash, tag, or "latest from main")
      placeholder: e.g., abc1234, latest from main
    validations:
      required: false

  - type: textarea
    id: environment-details
    attributes:
      label: Environment Details
      description: Please provide relevant environment and CLI version information
      placeholder: |
        - Operating System:
        - agentengine CLI Version:
        - Atlas CLI Version:
        - Node.js / pnpm Version:
        - Other relevant details:
    validations:
      required: false

  - type: textarea
    id: configuration-tools
    attributes:
      label: Configuration & Tools
      description: Any relevant agent configuration details or MCP tools/skills invoked during the run?
      placeholder: "e.g., Atlas MCP roles (GROUP_DATA_ACCESS_READ_ONLY), ALLOW_WRITE_OPERATIONS setting, custom agent.yaml or config.ts settings, MCP tools called, etc."
    validations:
      required: false

  - type: textarea
    id: error-messages
    attributes:
      label: Error Messages or Logs
      description: Please include any error messages, stack traces, agentengine CLI output, or trace details (remove any credentials or sensitive data)
      render: shell
    validations:
      required: false

  - type: textarea
    id: workarounds
    attributes:
      label: Workarounds
      description: Have you found any temporary workarounds for this issue?
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or information that might be helpful
    validations:
      required: false
