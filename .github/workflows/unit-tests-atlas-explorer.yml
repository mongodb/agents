name: Atlas Explorer unit tests

on:
  pull_request:
    paths:
      - "agents/**"
      - "packages/atlas-explorer-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-atlas-explorer.yml"
  push:
    branches:
      - main
    paths:
      - "agents/**"
      - "packages/atlas-explorer-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-atlas-explorer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
    with:
      working-directory: .
      test-command: pnpm --filter @repo/atlas-explorer-agent test && pnpm --filter atlas-explorer test
