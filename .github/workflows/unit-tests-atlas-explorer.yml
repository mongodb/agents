name: Atlas Explorer unit tests

on:
  pull_request:
    paths:
      - "agent-engine-templates/agents/atlas-explorer/**"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-atlas-explorer.yml"
  push:
    branches:
      - main
    paths:
      - "agent-engine-templates/agents/atlas-explorer/**"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-atlas-explorer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
    secrets:
      MAGENTA_GITHUB_TOKEN: ${{ secrets.MAGENTA_GITHUB_TOKEN }}
    with:
      working-directory: agent-engine-templates/agents/atlas-explorer
      private-git-deps: true
