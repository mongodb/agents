name: Load-test unit tests

on:
  pull_request:
    paths:
      - "packages/agent-engine-load-test/**"
      # The load-test pretest builds agent-engine-chat, so changes there can break it.
      - "packages/agent-engine-chat/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/**"
      - ".github/workflows/unit-tests-load-test.yml"
  push:
    branches:
      - main
    paths:
      - "packages/agent-engine-load-test/**"
      - "packages/agent-engine-chat/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/**"
      - ".github/workflows/unit-tests-load-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: agent-engine-load-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/unit-test
        with:
          command: pnpm --filter @repo/agent-engine-load-test test
