name: Endor Labs SCA Scan

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - ".github/workflows/endor-sca-scan.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  scan-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Allow git to fetch internal GitHub dependencies
        env:
          TOKEN: ${{ secrets.MAGENTA_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set repository secret MAGENTA_GITHUB_TOKEN to a PAT with read access to 10gen/magenta-client-libraries. github.token cannot clone that repository because it lives in a different GitHub org."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/10gen/".insteadOf "https://github.com/10gen/"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install

      - name: Endor Labs Scan
        uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e # v1.1.13
        env:
          # Without this, endorctl's package-manager autodetection falls back
          # to resolving dependencies as npm packages by version, which fails
          # for the git-pinned @mongodb-js/agent-engine-* packages (they
          # aren't published to the npm registry under that version).
          ENDOR_JS_PACKAGE_MANAGER: "pnpm"
          # The git-sourced @mongodb-js/agent-engine-* packages pin their own
          # packageManager as npm. Without this, corepack's strict pnpm shim
          # refuses to run inside those package directories during Endor's
          # reachability analysis.
          COREPACK_ENABLE_STRICT: "0"
        with:
          namespace: "mongodb.mongodb"
          scan_path: "."
          scan_dependencies: true
          pr: false

  scan-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Allow git to fetch internal GitHub dependencies
        env:
          TOKEN: ${{ secrets.MAGENTA_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set repository secret MAGENTA_GITHUB_TOKEN to a PAT with read access to 10gen/magenta-client-libraries. github.token cannot clone that repository because it lives in a different GitHub org."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/10gen/".insteadOf "https://github.com/10gen/"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install

      - name: Endor Labs Scan
        uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e # v1.1.13
        env:
          ENDOR_JS_PACKAGE_MANAGER: "pnpm"
          COREPACK_ENABLE_STRICT: "0"
        with:
          namespace: "mongodb.mongodb"
          scan_path: "."
          scan_dependencies: true
          pr: true
          pr_incremental: true
          enable_pr_comments: true
          github_token: ${{ github.token }}
