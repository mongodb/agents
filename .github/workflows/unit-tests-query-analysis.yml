name: Query Analysis unit tests

on:
  pull_request:
    paths:
      - "packages/agent-engine-core/**"
      - "packages/query-analysis-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-query-analysis.yml"
  push:
    branches:
      - main
    paths:
      - "packages/agent-engine-core/**"
      - "packages/query-analysis-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-query-analysis.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
    with:
      working-directory: .
      test-command: pnpm --filter @repo/query-analysis-agent test
