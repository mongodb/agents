name: Slack bot unit tests

on:
  pull_request:
    paths:
      - "apps/atlas-explorer-slack-bot/**"
      - "packages/agent-engine-chat/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/unit-test/**"
      - ".github/workflows/unit-tests-slack-bot.yml"
  push:
    branches:
      - main
    paths:
      - "apps/atlas-explorer-slack-bot/**"
      - "packages/agent-engine-chat/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/unit-test/**"
      - ".github/workflows/unit-tests-slack-bot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-engine-chat
            command: pnpm --filter @repo/agent-engine-chat test
          - name: atlas-explorer-slack-bot
            command: pnpm --filter @repo/atlas-explorer-slack-bot test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/unit-test
        with:
          command: ${{ matrix.command }}
