name: Slack bot unit tests

on:
  pull_request:
    paths:
      - "apps/atlas-explorer-slack-bot/**"
      - "packages/agent-engine-chat/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-slack-bot.yml"
  push:
    branches:
      - main
    paths:
      - "apps/atlas-explorer-slack-bot/**"
      - "packages/agent-engine-chat/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-slack-bot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
    with:
      working-directory: .
      test-command: pnpm --filter @repo/agent-engine-chat test && pnpm --filter @repo/atlas-explorer-slack-bot test
