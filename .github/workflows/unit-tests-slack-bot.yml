name: Slack bot unit tests

on:
  pull_request:
    paths:
      - "agent-engine-templates/slack-bot/**"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-slack-bot.yml"
  push:
    branches:
      - main
    paths:
      - "agent-engine-templates/slack-bot/**"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-slack-bot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
    with:
      working-directory: agent-engine-templates/slack-bot
