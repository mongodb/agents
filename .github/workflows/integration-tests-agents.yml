name: Agent integration tests

on:
  pull_request:
    paths:
      - "agents/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "packages/atlas-query-insights-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/workflows/integration-tests-agents.yml"
  push:
    branches:
      - main
    paths:
      - "agents/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "packages/atlas-query-insights-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/workflows/integration-tests-agents.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: atlas-explorer
            directory: agents/atlas-explorer
            filter: atlas-explorer
            store_db: atlas_explorer
            hitl: true
          - name: atlas-query-insights
            directory: agents/atlas-query-insights
            filter: atlas-query-insights
            store_db: atlas_query_insights
            hitl: false
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      AGENTENGINE_VERSION: "0.1.118"
      AGENTENGINE_USE_GATEWAY_PROXY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install

      - name: Get pnpm store directory
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install agentengine CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/agentengine" \
            "https://github.com/mongodb/agent-engine-client-libraries/releases/download/v${AGENTENGINE_VERSION}/agentengine_${AGENTENGINE_VERSION}_linux_x86_64"
          chmod +x "$HOME/.local/bin/agentengine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write local secrets
        working-directory: ${{ matrix.directory }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATLAS_MCP_CLIENT_ID_CI: ${{ secrets.ATLAS_MCP_CLIENT_ID_CI }}
          ATLAS_MCP_CLIENT_SECRET_CI: ${{ secrets.ATLAS_MCP_CLIENT_SECRET_CI }}
          STORE_DB: ${{ matrix.store_db }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$ATLAS_MCP_CLIENT_ID_CI" ] || [ -z "$ATLAS_MCP_CLIENT_SECRET_CI" ]; then
            echo "::error::Set repository secrets OPENAI_API_KEY, ATLAS_MCP_CLIENT_ID_CI, and ATLAS_MCP_CLIENT_SECRET_CI."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(".env").write_text(
              "\n".join(
                  [
                      "MONGODB_URI=",
                      f"MDB_AGENTIC_STORE_DB={os.environ['STORE_DB']}",
                      f"ATLAS_MCP_CLIENT_ID={os.environ['ATLAS_MCP_CLIENT_ID_CI']}",
                      f"ATLAS_MCP_CLIENT_SECRET={os.environ['ATLAS_MCP_CLIENT_SECRET_CI']}",
                      "ALLOW_WRITE_OPERATIONS=",
                      f"OPENAI_API_KEY={os.environ['OPENAI_API_KEY']}",
                      "",
                  ]
              )
          )
          PY

      - name: Start read-only stack
        working-directory: ${{ matrix.directory }}
        run: agentengine --no-log dev up --headless

      - name: Run read-only integration tests
        run: pnpm --filter ${{ matrix.filter }} test:integration

      - name: Restart stack with write tools enabled
        if: matrix.hitl
        working-directory: ${{ matrix.directory }}
        run: |
          agentengine --no-log dev stop
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".env")
          lines = [
              line
              for line in path.read_text().splitlines()
              if not line.startswith("ALLOW_WRITE_OPERATIONS")
          ]
          lines.append("ALLOW_WRITE_OPERATIONS=true")
          path.write_text("\n".join(lines) + "\n")
          PY
          agentengine --no-log dev up --headless

      - name: Run HITL integration tests
        if: matrix.hitl
        env:
          ALLOW_WRITE_OPERATIONS: "true"
        run: pnpm --filter ${{ matrix.filter }} test:integration

      - name: Collect stack logs
        if: always()
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p "${{ runner.temp }}/agentengine-logs"
          agentengine --no-log dev logs --no-follow --tail 2000 \
            > "${{ runner.temp }}/agentengine-logs/dev.log" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-dev-logs
          path: ${{ runner.temp }}/agentengine-logs
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        working-directory: ${{ matrix.directory }}
        run: agentengine --no-log dev clean || true
