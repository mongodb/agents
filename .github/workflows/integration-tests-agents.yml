name: Agent dev-up smoke

on:
  pull_request:
    paths:
      - "agents/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "packages/atlas-query-insights-agent/**"
      - "packages/testing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/**"
      - ".github/workflows/integration-tests-agents.yml"
  push:
    branches:
      - main
    paths:
      - "agents/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "packages/atlas-query-insights-agent/**"
      - "packages/testing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/**"
      - ".github/workflows/integration-tests-agents.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: atlas-explorer
            directory: agents/atlas-explorer
            store_db: atlas_explorer
          - name: atlas-query-insights
            directory: agents/atlas-query-insights
            store_db: atlas_query_insights
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      AGENTENGINE_VERSION: "0.1.118"
      AGENTENGINE_USE_GATEWAY_PROXY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Build agent bundle
        run: pnpm --filter ${{ matrix.name }} build

      - uses: ./.github/actions/install-agentengine-cli
        with:
          version: ${{ env.AGENTENGINE_VERSION }}

      - uses: ./.github/actions/start-agent-engine-local-stack
        with:
          directory: ${{ matrix.directory }}
          store-db: ${{ matrix.store_db }}

      - name: Collect stack logs
        if: always()
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p "${{ runner.temp }}/agentengine-logs"
          agentengine --no-log dev logs --no-follow --tail 2000 \
            > "${{ runner.temp }}/agentengine-logs/dev.log" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-dev-logs
          path: ${{ runner.temp }}/agentengine-logs
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        working-directory: ${{ matrix.directory }}
        run: agentengine --no-log dev clean || true
