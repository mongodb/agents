name: Evals (Atlas Query Insights)

on:
  pull_request:
    paths:
      - "agents/atlas-query-insights/**"
      - "packages/atlas-query-insights-agent/**"
      - "packages/agent-engine-core/**"
      - "packages/evals/**"
      - "pnpm-lock.yaml"
      - ".github/actions/run-eval/**"
      - ".github/workflows/evals-atlas-query-insights.yml"
  push:
    branches:
      - main
    paths:
      - "agents/atlas-query-insights/**"
      - "packages/atlas-query-insights-agent/**"
      - "packages/agent-engine-core/**"
      - "packages/evals/**"
      - "pnpm-lock.yaml"
      - ".github/actions/run-eval/**"
      - ".github/workflows/evals-atlas-query-insights.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fork-notice:
    name: Skipped for fork
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Evals need repository secrets, which fork PRs cannot read." >> "$GITHUB_STEP_SUMMARY"
          echo "After review, a maintainer can copy the fork's commit to a branch in this repository and run this workflow on that branch with workflow_dispatch." >> "$GITHUB_STEP_SUMMARY"

  evals:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The model is set in the scripts in packages/evals/package.json.
          # The Query Insights scripts use gpt-6-luna, not the agent's
          # production gpt-6.1-terra, because the Grove gateway does not
          # support terra yet. Switch them back, and re-baseline, when it does.
          - name: query-insights-guardrail
            script: eval:guardrail:query-insights
          - name: query-insights-knowledge
            script: eval:knowledge:query-insights
          - name: query-insights-report
            script: eval:query-insights
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Choose run id
        id: run
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUITE: ${{ matrix.name }}
        run: |
          case "$EVENT" in
            pull_request) id="$SUITE-pr-$PR_NUMBER" ;;
            push) id="$SUITE-main-${GITHUB_SHA::7}" ;;
            schedule) id="$SUITE-weekly-$(date -u +%F)" ;;
            *) id="$SUITE-manual-$(date -u +%F)-$GITHUB_RUN_ID" ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/run-eval
        with:
          name: ${{ matrix.name }}
          script: ${{ matrix.script }}
          run-id: ${{ steps.run.outputs.id }}
