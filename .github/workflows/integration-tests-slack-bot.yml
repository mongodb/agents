name: Slack bot local integration

on:
  pull_request:
    paths:
      - "apps/atlas-explorer-slack-bot/**"
      - "agents/atlas-explorer/**"
      - "packages/agent-engine-chat/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/**"
      - ".github/workflows/integration-tests-slack-bot.yml"
  push:
    branches:
      - main
    paths:
      - "apps/atlas-explorer-slack-bot/**"
      - "agents/atlas-explorer/**"
      - "packages/agent-engine-chat/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/**"
      - ".github/workflows/integration-tests-slack-bot.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: slack-bot local stack
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      AGENTENGINE_VERSION: "0.1.118"
      AGENTENGINE_USE_GATEWAY_PROXY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Build agent bundle
        run: pnpm --filter atlas-explorer build

      - uses: ./.github/actions/install-agentengine-cli
        with:
          version: ${{ env.AGENTENGINE_VERSION }}

      - name: Start local OpenAI stand-in
        run: |
          node apps/atlas-explorer-slack-bot/scripts/openai-local-mock.mjs \
            > "${{ runner.temp }}/openai-mock.log" 2>&1 &
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4010/v1/chat/completions \
              -H 'content-type: application/json' \
              -d '{"stream":false}' >/dev/null; then
              echo "OpenAI stand-in is ready"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::local OpenAI stand-in did not start"
          cat "${{ runner.temp }}/openai-mock.log" || true
          exit 1

      # --headless omits the Playground UI. --no-egress lets the tool sandbox
      # reach the OpenAI stand-in on the runner via host.docker.internal.
      - uses: ./.github/actions/start-agent-engine-local-stack
        with:
          directory: agents/atlas-explorer
          store-db: atlas_explorer
          extra-env: |
            OPENAI_BASE_URL=http://host.docker.internal:4010/v1
            OPENAI_USE_RESPONSES_API=false
          start-args: --headless --no-egress

      - name: Run Slack bot integration tests
        env:
          AGENTIC_PLAYGROUND_URL: http://127.0.0.1:8000
        run: pnpm --filter @repo/atlas-explorer-slack-bot test:integration

      - name: Collect stack logs
        if: always()
        working-directory: agents/atlas-explorer
        run: |
          mkdir -p "${{ runner.temp }}/agentengine-logs"
          agentengine --no-log dev logs --no-follow --tail 2000 \
            > "${{ runner.temp }}/agentengine-logs/dev.log" 2>&1 || true
          cp "${{ runner.temp }}/openai-mock.log" \
            "${{ runner.temp }}/agentengine-logs/openai-mock.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slack-bot-dev-logs
          path: ${{ runner.temp }}/agentengine-logs
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        working-directory: agents/atlas-explorer
        run: agentengine --no-log dev clean || true
