name: Agent unit tests

on:
  pull_request:
    paths:
      - "agents/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "packages/query-analysis-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-agents.yml"
  push:
    branches:
      - main
    paths:
      - "agents/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "packages/query-analysis-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-agents.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
    with:
      working-directory: .
      test-commands: >-
        [
          {"name":"agent-engine-core","command":"pnpm --filter @repo/agent-engine-core test"},
          {"name":"atlas-explorer-agent","command":"pnpm --filter @repo/atlas-explorer-agent test"},
          {"name":"atlas-explorer","command":"pnpm --filter atlas-explorer test"},
          {"name":"query-analysis","command":"pnpm --filter @repo/query-analysis-agent test"}
        ]
