name: Agent unit tests

on:
  pull_request:
    paths:
      - "agents/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "packages/atlas-query-insights-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/unit-test/**"
      - ".github/workflows/unit-tests-agents.yml"
  push:
    branches:
      - main
    paths:
      - "agents/**"
      - "packages/agent-engine-core/**"
      - "packages/atlas-explorer-agent/**"
      - "packages/atlas-query-insights-agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.test.base.json"
      - "vitest.shared.mts"
      - ".github/actions/unit-test/**"
      - ".github/workflows/unit-tests-agents.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-engine-core
            command: pnpm --filter @repo/agent-engine-core test
          - name: atlas-explorer-agent
            command: pnpm --filter @repo/atlas-explorer-agent test
          - name: atlas-explorer
            command: pnpm --filter atlas-explorer test
          - name: atlas-query-insights-agent
            command: pnpm --filter @repo/atlas-query-insights-agent test
          - name: atlas-query-insights
            command: pnpm --filter atlas-query-insights test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/unit-test
        with:
          command: ${{ matrix.command }}

  # Live call to knowledge.mongodb.com through the shared tools both agents
  # register. Kept out of `pnpm test` because that config stubs
  # @mongodb-js/mcp-fetch. Does not start the local stack.
  knowledge-api:
    name: knowledge API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/unit-test
        with:
          command: pnpm --filter @repo/agent-engine-core test:knowledge
